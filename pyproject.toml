[project]
name = "ros-agent"
version = "0.2.0"
description = "Offline ROS 2 debugging copilot that runs a small local model next to the robot"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
ros-agent = "ros_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ros_agent*"]

[tool.setuptools.package-data]
ros_agent = ["scenarios/*.yaml", "scenarios/bases/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
